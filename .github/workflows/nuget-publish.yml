name: Publish EndoCapture.Core to GitHub Packages

on:
  push:
    tags:
      - 'v*'          # Sadece "v1.0.0" gibi tag push'larında tetiklenir
  workflow_dispatch:  # Elle de çalıştırılabilir

jobs:
  publish:
    runs-on: ubuntu-latest  # Linux runner daha hızlı ve stabil

    permissions:
      contents: read
      packages: write   # GitHub Packages'e yazabilmek için zorunlu

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          # NUGET_AUTH_TOKEN ile GitHub Packages kimlik doğrulaması
          # setup-dotnet bu değişkeni otomatik olarak nuget.config'e yazar
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore EndoCapture.Core/EndoCapture.Core.csproj

      - name: Build
        run: dotnet build EndoCapture.Core/EndoCapture.Core.csproj --configuration Release --no-restore

      - name: Test (tüm projeyi)
        run: dotnet test --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack EndoCapture.Core/EndoCapture.Core.csproj --configuration Release --no-build --output nupkgs

      - name: Push to GitHub Packages
        run: dotnet nuget push "nupkgs/*.nupkg" --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
