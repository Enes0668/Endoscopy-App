name: Publish EndoCapture.Core to GitHub Packages

on:
  push:
    tags:
      - 'v*'          # Sadece "v1.0.0" gibi tag push'larında tetiklenir
  workflow_dispatch:  # Elle de çalıştırılabilir

jobs:
  publish:
    runs-on: windows-latest  # OpenCvSharp4.runtime.win sadece Windows DLL içerir

    permissions:
      contents: read
      packages: write

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          # source-url KULLANMIYORUZ — nuget.config zaten "github" kaynağını
          # tanımlıyor, tekrar eklemeye çalışmak "already exists" hatasına yol açıyor.

      - name: GitHub Packages kimlik doğrulaması
        # nuget.config'deki mevcut "github" kaynağının üzerine token yaz.
        # "add source" değil "update source" — kaynak zaten var, sadece credentials ekliyoruz.
        run: dotnet nuget update source github --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Restore
        run: dotnet restore EndoCapture.Core/EndoCapture.Core.csproj

      - name: Build
        run: dotnet build EndoCapture.Core/EndoCapture.Core.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack EndoCapture.Core/EndoCapture.Core.csproj --configuration Release --no-build --output nupkgs

      - name: Push to GitHub Packages
        run: dotnet nuget push "nupkgs/*.nupkg" --source github --skip-duplicate
