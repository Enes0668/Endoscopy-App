<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EndoCapture — Endoskopi Kayıt Sistemi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="report-generator.css">
  <link rel="stylesheet" href="image-annotator.css">
  <link rel="stylesheet" href="video-marker.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --surface2:  #263148;
      --border:    #334155;
      --text:      #f1f5f9;
      --muted:     #94a3b8;
      --primary:   #3b82f6;
      --primary-h: #2563eb;
      --green:     #22c55e;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --orange:    #f97316;
      --radius:    12px;
      --radius-sm: 8px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .logo span { color: var(--primary); }

    .header-divider { width: 1px; height: 28px; background: var(--border); }

    .room-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .room-label {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .room-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      padding: 7px 12px;
      outline: none;
      width: 120px;
      transition: border-color .15s;
    }
    .room-input:focus { border-color: var(--primary); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, transform .08s;
    }
    .btn:active { transform: scale(.97); }

    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-h); }

    .btn-ghost  { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: #475569; }

    .btn-green   { background: var(--green); color: #fff; }
    .btn-green:hover { background: #16a34a; }

    .btn-red     { background: var(--red); color: #fff; }
    .btn-red:hover { background: #dc2626; }

    .btn-amber   { background: var(--amber); color: #000; }
    .btn-amber:hover { background: #d97706; }

    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .header-status {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pedal-indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(59,130,246,.12);
      border: 1px solid rgba(59,130,246,.3);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: #93c5fd;
      margin-left: 10px;
      flex-shrink: 0;
    }
    .pedal-indicator strong { color: #fff; }
    .pedal-indicator kbd {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
      color: #f1f5f9;
      font-family: inherit;
    }

    /* ── LAYOUT ─────────────────────────────────────────── */
    .main {
      display: flex;
      gap: 16px;
      padding: 16px;
      flex: 1;
      min-height: 0;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 0 0 450px;
      width: 450px;
      min-width: 0;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
      padding-right: 4px;
      transition: width .2s ease, flex-basis .2s ease;
    }
    .left-col.has-multi-cam {
      flex: 0 0 860px;
      width: 860px;
      max-width: 62vw;
    }

    .right-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── CARD ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .card-body { padding: 14px 16px; }

    /* ── CAMERAS GRID (Yan yana / 2 Kolon) ──────────────── */
    .cameras-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      width: 100%;
    }
    .cameras-grid.multi-cam {
      grid-template-columns: 1fr 1fr;
    }

    /* ── CAMERA CARD ────────────────────────────────────── */
    .camera-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      width: 100%;
      flex-shrink: 0;
      position: relative;
      transition: border-color .15s, box-shadow .15s;
    }
    .camera-card.pedal-selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59,130,246,.3);
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      overflow: hidden;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .shutter-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease-out;
      z-index: 20;
    }
    .shutter-flash.flashing {
      opacity: 0.9;
      transition: none;
    }

    .video-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 10px;
      pointer-events: none;
      z-index: 10;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(34,197,94,.4);
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      backdrop-filter: blur(4px);
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-green 1.5s infinite;
    }

    .rec-badge {
      display: none;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(239,68,68,.5);
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      color: var(--red);
      backdrop-filter: blur(4px);
    }
    .rec-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      animation: blink 1s infinite;
    }
    .rec-timer { font-variant-numeric: tabular-nums; }

    .pedal-active-badge {
      display: none;
      position: absolute;
      bottom: 8px;
      right: 8px;
      align-items: center;
      gap: 4px;
      background: rgba(0,0,0,.7);
      border: 1px solid rgba(59,130,246,.5);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 600;
      color: #93c5fd;
      z-index: 10;
      pointer-events: none;
    }

    .video-no-signal {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .video-no-signal svg { opacity: .3; }

    .cam-info {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cam-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cam-room {
      font-size: 11px;
      color: var(--muted);
    }

    .cam-controls {
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .cam-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .cam-btn:active { transform: scale(.97); }

    .btn-snap {
      background: #2563eb;
      color: #fff;
    }
    .btn-snap:hover { background: #1d4ed8; }

    .btn-rec {
      color: #fff;
    }
    .btn-rec-start {
      background: #16a34a;
    }
    .btn-rec-start:hover { background: #15803d; }

    .btn-rec-stop {
      background: #dc2626;
      animation: pulse-red-border 1.5s infinite;
    }
    .btn-rec-stop:hover { background: #b91c1c; }

    .shortcut-hint {
      display: inline-block;
      font-size: 10px;
      font-family: inherit;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 4px;
      padding: 1px 5px;
      color: rgba(255,255,255,.9);
    }

    /* ── PATIENT INFO FORM ──────────────────────────────── */
    .patient-card {
      flex-shrink: 0;
    }

    .patient-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .left-col.has-multi-cam .patient-form {
      grid-template-columns: repeat(4, 1fr);
    }

    .field label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .field input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      padding: 7px 10px;
      outline: none;
      transition: border-color .15s;
    }
    .field input::placeholder { color: #475569; }
    .field input:focus { border-color: var(--primary); }

    .field-full {
      grid-column: 1 / -1;
    }

    .field-highlight {
      background: rgba(30,41,59,.5);
      border: 1px solid rgba(59,130,246,.3);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .field-highlight label {
      color: #93c5fd;
      font-weight: 700;
    }
    .field-highlight input {
      background: var(--surface);
      border-color: rgba(59,130,246,.4);
    }

    .field-hint {
      grid-column: 1 / -1;
      font-size: 11px;
      color: #64748b;
      padding-top: 2px;
    }

    /* ── RECORDS TABLE ──────────────────────────────────── */
    .records-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .table-wrap {
      flex: 1;
      overflow-y: auto;
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      position: sticky;
      top: 0;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      text-align: left;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    tbody td {
      padding: 10px 14px;
      font-size: 13px;
      vertical-align: middle;
    }

    .thumb {
      width: 72px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      background: #000;
      display: block;
    }
    .video-thumb {
      width: 72px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      background: #000;
    }

    /* ── BADGES ─────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-photo      { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.2); }
    .badge-video      { background: rgba(239,68,68,.12);  color: #f87171; border: 1px solid rgba(239,68,68,.2); }
    .badge-recording  { background: rgba(245,158,11,.12); color: #fbbf24; border: 1px solid rgba(245,158,11,.2); }
    .badge-interrupted{ background: rgba(249,115,22,.12); color: #fb923c; border: 1px solid rgba(249,115,22,.2); }
    .badge-corrupted  { background: rgba(100,116,139,.15);color: #94a3b8; border: 1px solid rgba(100,116,139,.2); }

    .context-primary { font-weight: 600; color: var(--text); }
    .context-sub { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

    .creator-badge {
      color: #93c5fd;
      font-weight: 500;
    }

    .pedal-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(59,130,246,.18);
      color: #93c5fd;
      border: 1px solid rgba(59,130,246,.35);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 600;
    }

    .actions-cell { display: flex; gap: 6px; align-items: center; }

    /* ── EMPTY STATE ────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 40px;
      color: var(--muted);
      font-size: 13px;
    }
    .empty-state svg { opacity: .3; }

    /* ── ANIMATIONS ─────────────────────────────────────── */
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse-green {
      0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.4); }
      50% { box-shadow: 0 0 0 4px rgba(34,197,94,0); }
    }
    @keyframes pulse-red-border {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
      50% { box-shadow: 0 0 0 4px rgba(239,68,68,0); }
    }

    /* ── CANVAS hidden ──────────────────────────────────── */
    canvas { display: none; }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 1360px) {
      .left-col.has-multi-cam {
        flex: 0 0 740px;
        width: 740px;
      }
    }
    @media (max-width: 1100px) {
      .main {
        flex-direction: column;
        overflow-y: auto;
      }
      .left-col, .left-col.has-multi-cam {
        flex: none;
        width: 100%;
        max-width: 100%;
        max-height: none;
      }
    }
    @media (max-width: 680px) {
      .cameras-grid.multi-cam {
        grid-template-columns: 1fr;
      }
      .left-col.has-multi-cam .patient-form {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ── SCROLLBAR ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>

  <!-- ── HEADER ──────────────────────────────────────────── -->
  <header class="header">
    <div class="logo">Endo<span>Capture</span></div>
    <div class="header-divider"></div>

    <div class="room-row">
      <span class="room-label">Oda:</span>
      <input
        id="room-id-input"
        class="room-input"
        type="text"
        value="oda1"
        onkeydown="if(event.key==='Enter'){event.preventDefault();onRoomIdChange();this.blur();}"
      />
      <button class="btn btn-primary" onclick="onRoomIdChange()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Bağlan
      </button>
      <button class="btn btn-ghost" onclick="setupCameras()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Yenile
      </button>
    </div>

    <!-- ── DOKTOR AYAK PEDALI & KISAYOL GÖSTERGESİ ── -->
    <div class="pedal-indicator" title="USB Ayak Pedalı veya Klavye Kısayolları Aktiftir">
      <span class="pedal-icon" style="font-size:11px;font-weight:700;background:rgba(59,130,246,.25);color:#93c5fd;padding:2px 6px;border-radius:4px;">PEDAL</span>
      <span><strong>Kısayol:</strong> <kbd>Boşluk / F12</kbd> Fotoğraf &nbsp;|&nbsp; <kbd>R / Enter</kbd> Video &nbsp;|&nbsp; <kbd>M</kbd> İşaretle (Marker)</span>
    </div>

    <span class="header-status" id="status">Başlatılıyor…</span>
  </header>

  <!-- ── MAIN ────────────────────────────────────────────── -->
  <div class="main">

    <!-- Left: Cameras + Patient Info -->
    <div class="left-col">

      <!-- Camera cards injected here -->
      <div class="cameras-grid" id="cameras-grid"></div>

      <!-- Patient Info -->
      <div class="card patient-card">
        <div class="card-header">
          <span class="card-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Hasta Bilgileri
          </span>
          <button class="btn btn-primary btn-sm" onclick="triggerReportGeneration()" style="background:#0284c7;border-color:#0284c7;display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Rapor Oluştur
          </button>
        </div>
        <div class="card-body">
          <div class="patient-form">
            <div class="field">
              <label for="ctx-patient-id">Hasta No (MRN)</label>
              <input id="ctx-patient-id" type="text" placeholder="örn. 10293847" />
            </div>
            <div class="field">
              <label for="ctx-patient-name">Hasta Adı Soyadı</label>
              <input id="ctx-patient-name" type="text" placeholder="örn. Ahmet Yılmaz" />
            </div>
            <div class="field">
              <label for="ctx-doctor-name">Doktor Adı</label>
              <input id="ctx-doctor-name" type="text" placeholder="örn. Dr. Ayşe Kaya" />
            </div>
            <div class="field">
              <label for="ctx-procedure-type">Prosedür / İşlem</label>
              <input id="ctx-procedure-type" type="text" placeholder="örn. Kolonoskopi" />
            </div>
            <div class="field field-full field-highlight">
              <label for="ctx-created-by">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Kaydı Oluşturan (Kullanıcı / Hemşire / Teknisyen)
              </label>
              <input id="ctx-created-by" type="text" placeholder="örn. Hemşire Zeynep" />
            </div>
            <p class="field-hint">Tüm alanlar isteğe bağlıdır. "Oluşturan" bilgisi otomatik hatırlanır ve kayıtlara damgalanır.</p>
          </div>
        </div>
      </div>

    </div>

    <!-- Right: Records -->
    <div class="right-col">
      <div class="card records-card">
        <div class="card-header">
          <span class="card-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 3H8"/><path d="M12 3v4"/></svg>
            Kayıtlar
          </span>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="btn btn-primary btn-sm" onclick="triggerReportGeneration()" style="background:#0284c7;border-color:#0284c7;display:inline-flex;align-items:center;gap:5px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              Tıbbi Rapor
            </button>
            <button class="btn btn-ghost btn-sm" onclick="loadCaptures()">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
              Yenile
            </button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Önizleme</th>
                <th>ID</th>
                <th>Tür</th>
                <th>Hasta / Doktor / Prosedür</th>
                <th>Süre / Durum</th>
                <th>Zaman</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="captures-table"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const statusEl    = document.getElementById('status');
    const roomIdInput = document.getElementById('room-id-input');
    const camerasGrid = document.getElementById('cameras-grid');

    function baseRoomId() { return roomIdInput.value.trim() || 'oda1'; }

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? '#f87171' : '';
    }

    function onRoomIdChange() {
      setStatus(`"${baseRoomId()}" odasına bağlanılıyor…`);
      setupCameras();
      loadCaptures();
    }

    // ── Multi-camera & Doktor Pedalı ────────────────────
    let activeCameras = [];
    let setupToken = 0;
    let selectedCameraIndex = 0;

    function getSelectedCam() {
      if (activeCameras.length === 0) return null;
      if (selectedCameraIndex >= activeCameras.length) selectedCameraIndex = 0;
      return activeCameras[selectedCameraIndex];
    }

    function updateCameraSelectionUI() {
      activeCameras.forEach((cam, idx) => {
        if (idx === selectedCameraIndex) {
          cam.cardEl.classList.add('pedal-selected');
          if (cam.pedalBadge) cam.pedalBadge.style.display = 'inline-flex';
        } else {
          cam.cardEl.classList.remove('pedal-selected');
          if (cam.pedalBadge) cam.pedalBadge.style.display = 'none';
        }
      });
    }

    // Web Audio Synthesizer (Fotoğraf deklanşör / tetikleme geri bildirimi)
    function playShutterSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch(e) {}
    }

    function triggerShutterFeedback(cam) {
      if (!cam) return;
      if (cam.flashEl) {
        cam.flashEl.classList.add('flashing');
        setTimeout(() => cam.flashEl.classList.remove('flashing'), 120);
      }
      playShutterSound();
    }

    async function setupCameras() {
      const myToken = ++setupToken;

      activeCameras.forEach(cam => {
        cam.socket?.close();
        clearInterval(cam.sendInterval);
        clearInterval(cam.timerInterval);
        cam.stream?.getTracks().forEach(t => t.stop());
      });
      activeCameras = [];
      camerasGrid.innerHTML = '';
      camerasGrid.className = 'cameras-grid';
      document.querySelector('.left-col')?.classList.remove('has-multi-cam');

      try {
        const permStream = await navigator.mediaDevices.getUserMedia({ video: true });
        permStream.getTracks().forEach(t => t.stop());
        if (myToken !== setupToken) return;

        const devices = await navigator.mediaDevices.enumerateDevices();
        if (myToken !== setupToken) return;

        const cams = devices.filter(d => d.kind === 'videoinput');
        if (cams.length === 0) { setStatus('Hiç kamera bulunamadı.', true); return; }

        setStatus(`${cams.length} kamera bulundu, bağlanılıyor…`);
        camerasGrid.className = cams.length > 1 ? 'cameras-grid multi-cam' : 'cameras-grid';
        const leftCol = document.querySelector('.left-col');
        if (leftCol) leftCol.classList.toggle('has-multi-cam', cams.length > 1);

        cams.forEach((cam, index) => setupOneCamera(cam.deviceId, cam.label, index, cams.length));
        updateCameraSelectionUI();
      } catch (err) {
        if (myToken !== setupToken) return;
        setStatus('Kamera hatası: ' + err.message, true);
      }
    }

    function setupOneCamera(deviceId, label, index, total) {
      const roomId = total > 1
        ? `${baseRoomId()}-cam${index + 1}`
        : baseRoomId();

      // ── Build card DOM ──────────────────────────────────
      const card = document.createElement('div');
      card.className = 'camera-card';
      card.innerHTML = `
        <div class="video-container">
          <video autoplay playsinline muted></video>
          <canvas></canvas>
          <div class="shutter-flash"></div>
          <div class="video-overlay">
            <span class="live-badge"><span class="live-dot"></span> CANLI</span>
            <span class="rec-badge">
              <span class="rec-dot"></span>
              REC <span class="rec-timer">00:00</span>
            </span>
          </div>
          <div class="pedal-active-badge">Pedal Aktif</div>
        </div>
        <div class="cam-info">
          <div class="cam-name">${label || `Kamera ${index + 1}`}</div>
          <div class="cam-room">Oda: ${roomId}</div>
        </div>
        <div class="cam-controls">
          <button class="cam-btn btn-snap" title="Fotoğraf Çek (Pedal / Boşluk - Video kaydı devam ederken de çekebilir)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
            <span>Fotoğraf Çek</span>
            <span class="shortcut-hint">Boşluk</span>
          </button>
          <button class="cam-btn btn-rec btn-rec-start" title="Video Kaydını Başlat / Durdur (Pedal / R)">
            <svg class="rec-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
            <span class="rec-text">Kayıt Başlat</span>
            <span class="shortcut-hint">R</span>
          </button>
          <button class="cam-btn btn-marker" title="Önemli Anı İşaretle / Bookmark (Kayıt sürerken M tuşu)" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span>İşaretle</span>
            <span class="shortcut-hint">M</span>
          </button>
        </div>
      `;
      camerasGrid.appendChild(card);

      const videoEl    = card.querySelector('video');
      const canvas     = card.querySelector('canvas');
      const ctx        = canvas.getContext('2d');
      const flashEl    = card.querySelector('.shutter-flash');
      const recBadge   = card.querySelector('.rec-badge');
      const recTimer   = card.querySelector('.rec-timer');
      const pedalBadge = card.querySelector('.pedal-active-badge');
      const snapBtn    = card.querySelector('.btn-snap');
      const recBtn     = card.querySelector('.btn-rec');
      const markerBtn  = card.querySelector('.btn-marker');

      const cam = {
        roomId, deviceId, stream: null, socket: null, sendInterval: null,
        isRecording: false, recordingStartedAt: null, timerInterval: null,
        videoEl, canvas, ctx, flashEl, recBadge, recTimer, pedalBadge, snapBtn, recBtn, markerBtn, cardEl: card
      };
      activeCameras.push(cam);

      // Kart tıklandığında bu kamerayı pedal için aktif seç
      card.addEventListener('click', (e) => {
        const idx = activeCameras.indexOf(cam);
        if (idx !== -1 && idx !== selectedCameraIndex) {
          selectedCameraIndex = idx;
          updateCameraSelectionUI();
        }
      });

      // Fotoğraf çekme (Kayıt sürerken de KESİNTİSİZ çalışır!)
      snapBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedCameraIndex = activeCameras.indexOf(cam);
        updateCameraSelectionUI();
        takeSnapshot(cam, 'WEB_UI_BUTTON');
      });

      // Video kaydını başlat / durdur
      recBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedCameraIndex = activeCameras.indexOf(cam);
        updateCameraSelectionUI();
        toggleRecording(cam, 'WEB_UI_BUTTON');
      });

      // Canlı Video Marker (İşaret) Ekleme
      markerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedCameraIndex = activeCameras.indexOf(cam);
        updateCameraSelectionUI();
        addLiveMarker(cam, 'Önemli Bulgu');
      });

      // WebSocket
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      cam.socket = new WebSocket(`${protocol}//${location.host}/ws-camera/${roomId}`);
      cam.socket.binaryType = 'arraybuffer';
      cam.socket.onopen  = () => setStatus(`Bağlandı: ${roomId}`);
      cam.socket.onerror = () => setStatus(`Bağlantı hatası: ${roomId}`, true);

      navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId } } })
        .then(stream => {
          cam.stream = stream;
          videoEl.srcObject = stream;
          cam.sendInterval = setInterval(() => {
            if (!cam.socket || cam.socket.readyState !== WebSocket.OPEN) return;
            if (videoEl.videoWidth === 0) return;
            canvas.width  = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            ctx.drawImage(videoEl, 0, 0);
            canvas.toBlob(blob => {
              if (!blob) return;
              blob.arrayBuffer().then(buf => cam.socket.send(buf));
            }, 'image/jpeg', 0.7);
          }, 200);
        })
        .catch(err => setStatus(`Kamera hatası (${roomId}): ${err.message}`, true));

      syncRecordingState(cam);
    }

    // ── Context payload ───────────────────────────────────
    function readContextPayload() {
      const v = id => document.getElementById(id).value.trim() || null;
      return {
        patientIdentifier: v('ctx-patient-id'),
        patientName:       v('ctx-patient-name'),
        doctorName:        v('ctx-doctor-name'),
        procedureType:     v('ctx-procedure-type'),
        createdByName:     v('ctx-created-by'),
      };
    }

    // ── Snapshot (Kayıt devam ederken de çekilebilir!) ────
    async function takeSnapshot(cam, triggerSource = 'WEB_UI_BUTTON') {
      if (!cam) return;
      triggerShutterFeedback(cam);
      const isRecNote = cam.isRecording ? ' (Video kaydı devam ediyor)' : '';
      const prefix = triggerSource === 'FOOT_PEDAL' ? '[Pedal] ' : '';
      setStatus(`${prefix}Fotoğraf alınıyor (${cam.roomId})${isRecNote}…`);

      try {
        const res = await fetch(`/api/rooms/${cam.roomId}/capture`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ triggerSource: triggerSource, ...readContextPayload() })
        });
        if (!res.ok) {
          const e = await res.json().catch(()=>({}));
          setStatus('Hata: ' + (e.message || res.statusText), true);
          return;
        }
        const d = await res.json();
        setStatus(`${prefix}Fotoğraf kaydedildi — Id: #${d.id}, Dosya: ${d.filePath}${isRecNote}`);
        loadCaptures();
      } catch(e) {
        setStatus('Bağlantı hatası: ' + e.message, true);
      }
    }

    // ── Start recording ───────────────────────────────────
    async function startRecording(cam, triggerSource = 'WEB_UI_BUTTON') {
      if (!cam) return;
      const prefix = triggerSource === 'FOOT_PEDAL' ? '[Pedal] ' : '';
      setStatus(`${prefix}Video kaydı başlatılıyor (${cam.roomId})…`);
      try {
        const res = await fetch(`/api/rooms/${cam.roomId}/capture/video/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ triggerSource: triggerSource, ...readContextPayload() })
        });
        if (!res.ok) {
          const e = await res.json().catch(()=>({}));
          setStatus('Hata: ' + (e.message || res.statusText), true);
          return;
        }
        const d = await res.json();
        enterRecordingState(cam, new Date(d.startedAt));
        setStatus(`${prefix}Video kaydı başladı — Id: #${d.id} (Kayıt sırasında Boşluk tuşu/pedal ile fotoğraf çekebilirsiniz)`);
        loadCaptures();
      } catch(e) {
        setStatus('Bağlantı hatası: ' + e.message, true);
      }
    }

    // ── Stop recording ────────────────────────────────────
    async function stopRecording(cam) {
      if (!cam) return;
      setStatus(`Video kaydı durduruluyor (${cam.roomId})…`);
      try {
        const res = await fetch(`/api/rooms/${cam.roomId}/capture/video/stop`, { method: 'POST' });
        if (!res.ok) {
          const e = await res.json().catch(()=>({}));
          setStatus('Hata: ' + (e.message || res.statusText), true);
          return;
        }
        const d = await res.json();
        exitRecordingState(cam);
        const sec = d.durationMs ? Math.round(d.durationMs / 1000) : '?';
        setStatus(d.verified === false
          ? `Kayıt durduruldu (${sec}sn) ama dosya doğrulanamadı — Id: #${d.id}`
          : `Video kaydı durduruldu — ${sec}sn, Id: #${d.id}`);
        loadCaptures();
      } catch(e) {
        setStatus('Bağlantı hatası: ' + e.message, true);
      }
    }

    function toggleRecording(cam, triggerSource = 'WEB_UI_BUTTON') {
      if (!cam) return;
      if (cam.isRecording) {
        stopRecording(cam);
      } else {
        startRecording(cam, triggerSource);
      }
    }

    // ── Recording state UI ────────────────────────────────
    function enterRecordingState(cam, startedAt) {
      cam.isRecording = true;
      cam.recordingStartedAt = startedAt;
      cam.recBadge.style.display = 'inline-flex';

      cam.recBtn.className = 'cam-btn btn-rec btn-rec-stop';
      cam.recBtn.querySelector('.rec-text').textContent = 'Kaydı Durdur';
      cam.recBtn.querySelector('.rec-icon').innerHTML = `<rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"/>`;

      if (cam.markerBtn) {
        cam.markerBtn.disabled = false;
      }

      // snapBtn (Fotoğraf çek) düğmesi ASLA devre dışı bırakılmaz, kayıt sürerken de aktiftir!
      clearInterval(cam.timerInterval);
      cam.timerInterval = setInterval(() => updateTimer(cam), 500);
      updateTimer(cam);
    }

    function exitRecordingState(cam) {
      cam.isRecording = false;
      cam.recordingStartedAt = null;
      cam.recBadge.style.display = 'none';

      cam.recBtn.className = 'cam-btn btn-rec btn-rec-start';
      cam.recBtn.querySelector('.rec-text').textContent = 'Kayıt Başlat';
      cam.recBtn.querySelector('.rec-icon').innerHTML = `<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/>`;

      if (cam.markerBtn) {
        cam.markerBtn.disabled = true;
      }

      clearInterval(cam.timerInterval);
    }

    function updateTimer(cam) {
      if (!cam.recordingStartedAt) return;
      const s = Math.floor((Date.now() - cam.recordingStartedAt.getTime()) / 1000);
      cam.recTimer.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    }

    async function syncRecordingState(cam) {
      try {
        const res = await fetch(`/api/rooms/${cam.roomId}/capture/video/status`);
        const d = await res.json();
        if (d.isRecording && d.capture) {
          enterRecordingState(cam, new Date(d.capture.capturedAt));
          setStatus(`Devam eden kayıt bulundu (${cam.roomId}, Id: #${d.capture.id})`);
        }
      } catch {}
    }

    // ── Live Video Marker ────────────────────────────────
    async function addLiveMarker(cam, defaultLabel = 'Önemli Bulgu') {
      if (!cam || !cam.isRecording) {
        setStatus('İşaret eklemek için aktif bir video kaydı olmalıdır.', true);
        return;
      }
      playShutterSound();
      setStatus(`Zaman damgalı işaret ekleniyor (${cam.roomId})…`);
      try {
        const res = await fetch(`/api/rooms/${cam.roomId}/capture/video/marker`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: defaultLabel })
        });
        if (!res.ok) {
          const e = await res.json().catch(()=>({}));
          setStatus('Marker hatası: ' + (e.message || res.statusText), true);
          return;
        }
        const d = await res.json();
        const sec = Math.round(d.timestampMs / 1000);
        const m = String(Math.floor(sec/60)).padStart(2,'0');
        const s = String(sec%60).padStart(2,'0');
        setStatus(`Video işareti eklendi: [${m}:${s}] ${d.label} (Id: #${d.id})`);
      } catch(e) {
        setStatus('Marker bağlantı hatası: ' + e.message, true);
      }
    }

    // ── DOKTOR AYAK PEDALI & KLAVYE DİNLEYİCİSİ ───────────
    window.addEventListener('keydown', (e) => {
      // Bir input, textarea veya seçim kutusuna yazı yazılıyorsa tuşları engelleme
      const activeTag = document.activeElement?.tagName;
      if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') {
        return;
      }

      const cam = getSelectedCam();
      if (!cam) return;

      // PEDAL 1 (Fotoğraf Çekimi): Boşluk (Space), F12, 'P' tuşu
      // Video kaydı devam ederken de fotoğraf çeker!
      if (e.code === 'Space' || e.key === ' ' || e.key === 'F12' || e.code === 'KeyP') {
        e.preventDefault();
        takeSnapshot(cam, 'FOOT_PEDAL');
        return;
      }

      // PEDAL 2 (Video Başlat / Durdur): 'R' tuşu, Enter (input dışında), F9
      if (e.code === 'KeyR' || e.key === 'Enter' || e.key === 'F9') {
        e.preventDefault();
        toggleRecording(cam, 'FOOT_PEDAL');
        return;
      }

      // PEDAL 3 / KISAYOL (Video Marker): 'M' tuşu
      if (e.code === 'KeyM' || e.key === 'm' || e.key === 'M') {
        if (cam.isRecording) {
          e.preventDefault();
          addLiveMarker(cam, 'Önemli Bulgu');
        }
        return;
      }
    });

    // ── "Oluşturan" Alanını Hatırlama (localStorage) ─────
    const creatorInput = document.getElementById('ctx-created-by');
    if (creatorInput) {
      const savedCreator = localStorage.getItem('endocapture_creator');
      if (savedCreator) creatorInput.value = savedCreator;
      creatorInput.addEventListener('input', () => {
        localStorage.setItem('endocapture_creator', creatorInput.value.trim());
      });
    }

    // ── Helpers ───────────────────────────────────────────
    function fmtSize(b) {
      if (b == null) return '';
      if (b < 1024) return `${b} B`;
      if (b < 1048576) return `${(b/1024).toFixed(1)} KB`;
      return `${(b/1048576).toFixed(2)} MB`;
    }

    function typeBadge(item) {
      if (item.captureType === 'video') {
        switch (item.status) {
          case 'recording':   return `<span class="badge badge-recording">Kayıtta</span>`;
          case 'interrupted': return `<span class="badge badge-interrupted">Kesildi</span>`;
          case 'corrupted':   return `<span class="badge badge-corrupted">Bozuk</span>`;
          default:            return `<span class="badge badge-video">Video</span>`;
        }
      }
      return `<span class="badge badge-photo">Fotoğraf</span>`;
    }

    function contextCell(item) {
      const lines = [];
      if (item.patientName || item.patientIdentifier) {
        const id = item.patientIdentifier ? ` <span style="color:var(--muted);font-weight:400">(${item.patientIdentifier})</span>` : '';
        lines.push(`<div class="context-primary">${item.patientName ?? 'İsimsiz'}${id}</div>`);
      }
      const subs = [];
      if (item.doctorName)    subs.push(item.doctorName);
      if (item.procedureType) subs.push(item.procedureType);
      if (item.roomName)      subs.push(item.roomName);
      if (item.createdByName) subs.push(`<span class="creator-badge">${item.createdByName}</span>`);
      if (item.triggerSource === 'FOOT_PEDAL') subs.push(`<span class="pedal-tag">Pedal</span>`);
      if (subs.length) lines.push(`<div class="context-sub">${subs.join(' · ')}</div>`);
      return lines.length ? lines.join('') : `<span style="color:var(--border)">—</span>`;
    }

    function durationCell(item) {
      if (item.captureType !== 'video') return '—';
      if (item.status === 'recording') return `<span style="color:var(--red)">devam ediyor…</span>`;
      if (item.durationMs != null) {
        const sec = Math.round(item.durationMs / 1000);
        const main = item.status === 'interrupted' ? `~${sec}sn (tahmini)` : `${sec}sn`;
        let sub = '';
        if (item.frameCount && item.durationMs) {
          const fps = (item.frameCount / (item.durationMs/1000)).toFixed(1);
          sub = `<div class="context-sub">${item.frameCount} kare · ~${fps}fps`;
          if (item.fileSizeBytes) sub += ` · ${fmtSize(item.fileSizeBytes)}`;
          sub += '</div>';
        }
        return main + sub;
      }
      return '—';
    }

    function previewCell(item) {
      if (item.captureType === 'video') {
        if (item.status === 'recording') return `<span style="color:var(--red);font-size:12px">Kayıt sürüyor…</span>`;
        return `<video src="${item.filePath}" class="video-thumb" controls muted></video>`;
      }
      const info = (item.width && item.height) ? `${item.width}×${item.height}` : '';
      return `<img src="${item.filePath}" class="thumb" title="${info} · Tıklayarak Çizim/Ölçüm yapın" style="cursor:pointer" onclick="openAnnotatorForItem(${item.id})" />`;
    }

    // ── Load captures ─────────────────────────────────────
    async function loadCaptures() {
      try {
        const res  = await fetch(`/api/captures?roomId=${encodeURIComponent(baseRoomId())}`);
        const data = await res.json();
        window.capturesData = data;
        const tbody = document.getElementById('captures-table');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7">
            <div class="empty-state">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 3H8"/></svg>
              Henüz kayıt yok
            </div>
          </td></tr>`;
          return;
        }

        data.forEach(item => {
          const rec = item.status === 'recording';
          const delBtn = rec ? '' : `<button class="btn btn-red btn-sm" onclick="deleteCapture(${item.id})" title="Listeden gizle">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>`;
          const refBtn = rec ? '' : `<button class="btn btn-ghost btn-sm" onclick="refreshMetadata(${item.id})" title="Metadata yenile">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>`;
          const annBtn = (!rec && item.captureType === 'photo')
            ? `<button class="btn btn-ghost btn-sm" onclick="openAnnotatorForItem(${item.id})" title="Fotoğraf üzerine çizim ve ölçüm yap">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              </button>`
            : '';
          const mrkBtn = (!rec && item.captureType === 'video')
            ? `<button class="btn btn-ghost btn-sm" onclick="openMarkerForItem(${item.id})" title="Zaman damgalı işaretleri (marker) görüntüle ve düzenle">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              </button>`
            : '';

          tbody.innerHTML += `
            <tr>
              <td>${previewCell(item)}</td>
              <td style="color:var(--muted);font-size:12px">#${item.id}</td>
              <td>${typeBadge(item)}</td>
              <td>${contextCell(item)}</td>
              <td>${durationCell(item)}</td>
              <td style="color:var(--muted);font-size:12px;white-space:nowrap">${new Date(item.capturedAt).toLocaleString('tr-TR')}</td>
              <td><div class="actions-cell">${annBtn}${mrkBtn}${refBtn}${delBtn}</div></td>
            </tr>`;
        });
      } catch(e) { setStatus('Kayıtlar yüklenemedi: '+e.message, true); }
    }

    // ── Refresh metadata ──────────────────────────────────
    async function refreshMetadata(id) {
      setStatus(`Id=${id} metadata yenileniyor…`);
      try {
        const res = await fetch(`/api/captures/${id}/refresh-metadata`, { method: 'POST' });
        if (!res.ok) { const e = await res.json().catch(()=>({})); setStatus('Hata: '+(e.message||res.statusText), true); return; }
        const d = await res.json();
        setStatus(`Id=${id} güncellendi: ${d.width ?? '—'}×${d.height ?? '—'}, ${d.frameCount ?? '—'} kare, ${fmtSize(d.fileSizeBytes)}`);
        loadCaptures();
      } catch(e) { setStatus('Bağlantı hatası: '+e.message, true); }
    }

    // ── Delete capture ────────────────────────────────────
    async function deleteCapture(id) {
      if (!confirm(`Id=${id} olan kaydı listeden kaldırmak istediğinize emin misiniz?\n(Dosya silinmez, sadece listeden gizlenir.)`)) return;
      try {
        const res = await fetch(`/api/captures/${id}`, { method: 'DELETE' });
        if (!res.ok) { const e = await res.json().catch(()=>({})); setStatus('Hata: '+(e.message||res.statusText), true); return; }
        setStatus(`Id=${id} listeden kaldırıldı`);
        loadCaptures();
      } catch(e) { setStatus('Bağlantı hatası: '+e.message, true); }
    }

    // ── Medical Report Trigger ───────────────────────────
    function triggerReportGeneration() {
      const patientId = document.getElementById('ctx-patient-id')?.value.trim();
      const patientName = document.getElementById('ctx-patient-name')?.value.trim();
      const doctorName = document.getElementById('ctx-doctor-name')?.value.trim();
      const procedureType = document.getElementById('ctx-procedure-type')?.value.trim();
      const createdByName = document.getElementById('ctx-created-by')?.value.trim();
      const roomId = typeof activeRoomId !== 'undefined' ? activeRoomId : (baseRoomId ? baseRoomId() : 'oda1');

      // Filter photos from capturesData
      const photos = (window.capturesData || []).filter(c => c.captureType === 'photo');

      if (window.MedicalReport) {
        window.MedicalReport.open({
          patientIdentifier: patientId,
          patientName: patientName,
          doctorName: doctorName,
          procedureType: procedureType,
          createdByName: createdByName,
          roomName: roomId,
          captures: photos
        });
      } else {
        alert('Rapor motoru yükleniyor, lütfen birkaç saniye sonra tekrar deneyin.');
      }
    }

    // ── Open Annotator ────────────────────────────────────
    function openAnnotatorForItem(id) {
      const item = (window.capturesData || []).find(c => c.id === id);
      if (!item) return;
      if (window.MedicalAnnotator) {
        window.MedicalAnnotator.open(item, () => {
          setStatus('İşaretli yeni fotoğraf kaydedildi.');
          loadCaptures();
        });
      }
    }

    // ── Open Video Marker ─────────────────────────────────
    function openMarkerForItem(id) {
      const item = (window.capturesData || []).find(c => c.id === id);
      if (!item) return;
      if (window.VideoMarker) {
        window.VideoMarker.openForCapture(item);
      }
    }

    // ── Init ──────────────────────────────────────────────
    setupCameras();
    loadCaptures();
  </script>
  <script src="html2pdf.bundle.min.js"></script>
  <script src="video-marker.js"></script>
  <script src="report-generator.js"></script>
  <script src="image-annotator.js"></script>
</body>
</html>
